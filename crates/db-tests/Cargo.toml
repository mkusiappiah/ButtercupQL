[package]
name = "db-tests"
description = "Runs the SQL ButtercupQL writes on SQLite, PostgreSQL, DuckDB and ClickHouse, and checks that each gives the rows Python's meaning gives."
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
buttercupql = { path = "../buttercupql" }
postgres = "0.19"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", default-features = false }
