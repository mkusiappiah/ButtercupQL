[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Michael Kusi-Appiah <appiah.michael@yahoo.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkusiappiah/ButtercupQL"
homepage = "https://github.com/mkusiappiah/ButtercupQL"

# The playground's WebAssembly build: small, as a browser downloads it.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
