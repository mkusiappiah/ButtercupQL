name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --exclude db-tests --exclude buttercupql-python --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude db-tests --exclude buttercupql-python

  python:
    name: Python ${{ matrix.python }} package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14"]
        include:
          # The oldest Python the package supports.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lints
        run: cargo clippy -p buttercupql-python --all-targets -- -D warnings
      - name: Build and install the package
        shell: bash
        run: |
          python -m pip install maturin pytest
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist buttercupql
      - name: Tests
        run: python -m pytest -q crates/python/tests
      - name: The command
        shell: bash
        run: |
          bcql --version
          printf 'from cases\nwhere status == "open"\n' > open.bcql
          bcql compile open.bcql --dialect sqlite

  vscode:
    name: The VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Packages
        run: npm ci
      - name: Tests
        run: npm test
      - name: Package
        run: npx vsce package --out buttercupql.vsix
      - name: The package's bundle loads
        run: node test/bundle.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: buttercupql-vsix
          path: editors/vscode/buttercupql.vsix

  playground:
    name: The playground, built for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build
        run: cargo build -p buttercupql-wasm --target wasm32-unknown-unknown --profile wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Put the site together
        run: node playground/build.mjs target/wasm32-unknown-unknown/wasm/buttercupql_wasm.wasm site/playground
      - name: Tests
        run: node playground/test.mjs site/playground

  databases:
    name: Run the SQL on SQLite, PostgreSQL, DuckDB and ClickHouse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # A database made for this job alone, and thrown away after it.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          # Also made for this job alone.
          CLICKHOUSE_USER: bcql
          CLICKHOUSE_PASSWORD: bcql
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user bcql --password bcql --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BCQL_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BCQL_CLICKHOUSE_URL: http://localhost:8123
      BCQL_CLICKHOUSE_USER: bcql
      BCQL_CLICKHOUSE_PASSWORD: bcql
      BCQL_DUCKDB_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: DuckDB
        run: python -m pip install duckdb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lints
        run: cargo clippy -p db-tests --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p db-tests -- --nocapture
